env_name: RobotLab-G1-MultiDynamics
data_type: official_mixed_v1
max_episode_steps: 64
prompt_episode_horizon: 1
prompt_horizon: 64

# C ablation: fixed Top-2 Token MoE, dynamic Task MoE.
num_tasks: 48
training_tasks: 42
eval_tasks: [5, 14, 23, 32, 41, 47]
action_tanh: false

supervision_mode: all_tokens
batch_size: 32
enforce_unique_contrastive_tasks: true
gradient_accumulation_steps: 1
warmup_steps: 5000
total_steps: 100000
eval_every: 500
checkpoint_every: 5000
validation_fraction: 0.20
validation_samples_per_task: 512
validation_batch_size: 256
early_stopping_patience: 30
early_stopping_min_delta: 0.000001
lr: 0.0003
weight_decay: 0.0001
max_grad_norm: 1.0

hidden_dim: 128
ff_dim: [512, 512, 512, 768]
n_layer: 4
n_head: 4
ff_pdrop: 0.05
ff_moe_pdrop: 0.01
emb_pdrop: 0.05
attn_pdrop: 0.05
activation_function: gelu_new

moe_config:
  moe_layers_contrastive_and_balance: [3]
  task_hard_router: false
  use_top_k_indices: false
  add_softmax: false
  detach_gate_input: false
  num_experts: 6
  num_selects: 2
  token_routing_mode: topk
  token_top_p_threshold: 0.4
  token_top_p_max_selects: 6
  expert_dim: 1536
  gate_balance_loss_weight: 0.01
  gate_add_noise: true
  gate_noise_epsilon: 0.01
  tau: 0.005
  contrastive_loss_weight: 0.01
  num_experts_contrastive: 8
  num_selects_contrastive: 2
  task_routing_mode: topp
  task_top_p_threshold: 0.4
  task_top_p_max_selects: 8
  expert_dim_contrastive: 2048
